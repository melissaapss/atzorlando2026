
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATEEZ Golden Hour Pt 6 | Orlando Events</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#050b1a;color:white;
 font-family:Arial,sans-serif;
}
header{
 text-align:center;padding:45px 15px;
 background:linear-gradient(135deg,#07152f,#162b50,#070b17);
 border-bottom:2px solid #d6ac64;
}
header h1{
 font-size:clamp(36px,7vw,65px);
 letter-spacing:5px;margin:10px 0;
 color:#e9c680;text-shadow:0 0 25px #c49a5555;
}
header p{color:#c2cce0;letter-spacing:3px}
.stars{
 color:#e9c680;letter-spacing:15px;font-size:20px;
}
.banner{
 max-width:1100px;margin:25px auto;
 height:220px;border:1px solid #806b47;
 border-radius:14px;overflow:hidden;
 background:linear-gradient(120deg,#101f3b,#080e1c);
 display:grid;place-items:center;text-align:center;
 color:#a5b5ce;background-size:cover;
 background-position:center;
}
/* Add your banner photo URL below */
.banner{
 background-image:linear-gradient(#06112677,#06112677),
 url("banner.jpg");
}
main{max-width:1200px;margin:auto;padding:15px}
.tabs{display:flex;gap:10px;margin:25px 0}
.tabs button{
 flex:1;padding:17px 5px;border:1px solid #9e8150;
 border-radius:9px;background:#101d36;
 color:#c7d2e7;font-weight:bold;font-size:16px;
 cursor:pointer;
}
.tabs button.active{
 background:#d6ac64;color:#081326;
 box-shadow:0 0 20px #d6ac6440;
}
.layout{
 display:grid;grid-template-columns:350px 1fr;
 gap:20px;
}
#list{
 background:#0d1b32;border:1px solid #354665;
 border-radius:12px;padding:15px;
 max-height:570px;overflow:auto;
}
.card{
 background:#142541;border:1px solid #344b6e;
 border-radius:12px;overflow:hidden;
 margin-bottom:16px;cursor:pointer;
}
.card:hover{border-color:#d6ac64}
.card img{
 width:100%;height:150px;object-fit:cover;
 display:block;
}
.image-placeholder{
 height:145px;display:grid;place-items:center;
 background:#1b3050;color:#a9bedb;
}
.details{padding:15px}
.details h3{margin:8px 0;color:#f2d398}
.details p{font-size:13px;color:#c0cce0;line-height:1.5}
.time{color:#eac27c;font-weight:bold;font-size:13px}
#map{
 height:570px;border-radius:12px;
 border:2px solid #a48b5b;
}
.leaflet-popup-content{color:#172139}
.leaflet-popup-content a{color:#1767ae}
.empty{text-align:center;color:#9badc9;padding:45px 10px}
footer{
 text-align:center;padding:30px;color:#a2b2cc;
 font-size:12px;
}
@media(max-width:800px){
 .layout{grid-template-columns:1fr}
 #list{max-height:350px}
 #map{height:420px}
 .tabs button{font-size:13px}
}
</style>
</head>

<body>
<header>
 <div class="stars">✦ ✧ ✦ ✧ ✦</div>
 <h1>ATEEZ Golden Hour Pt 6</h1>
 <p>ORLANDO • ATINY EVENT MAP</p>
 <div class="stars">✧ ✦ ✧</div>
</header>

<main>

<!-- BANNER IMAGE AREA -->
<div class="banner">
 <div>
 </div>
</div>

<!-- THREE DAY TABS -->
<div class="tabs">
 <button class="active" onclick="showDay('Friday',this)">FRIDAY</button>
 <button onclick="showDay('Saturday',this)">SATURDAY</button>
 <button onclick="showDay('Sunday',this)">SUNDAY</button>
</div>

<h2 id="heading">✦ Friday Events</h2>

<div class="layout">
 <div id="list"></div>
 <div id="map"></div>
</div>
</main>

<footer>
 ✦ ATEEZ ORLANDO WEEKEND ✦<br><br>
 Fan-made event guide • Not affiliated with ATEEZ or KQ Entertainment
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const events = [

 {
  day:"Friday",
  title:"Hello82 Pop-up",
  time:"8:00 AM",
  place:"Barnes & Noble",
  address:"2418 E Colonial Dr, Orlando, FL 32803",
  description:"Hello82 offical pop-up",
  image:"./goldh61.jpg",
  lat:28.5516405,
  lng:-81.3497879,
  link:"https://hello82.com/blogs/announcements/ateez-golden-hour-part-6-album-release-event-locations?srsltid=AYCX9vJeob4YINomOrvjW84hayGK6HdzuG8dkI9zGE7WwgloR9MiTDuP"
 },

  {
  day:"Saturday",
  title:"Hello82 Pop-up",
  time:"8:00 AM",
  place:"Barnes & Noble",
  address:"2418 E Colonial Dr, Orlando, FL 32803",
  description:"Hello82 offical pop-up",
  image:"goldh61.jpg",
  lat:28.5516405,
  lng:-81.3497879,
  link:"https://hello82.com/blogs/announcements/ateez-golden-hour-part-6-album-release-event-locations?srsltid=AYCX9vJeob4YINomOrvjW84hayGK6HdzuG8dkI9zGE7WwgloR9MiTDuP"
 },

  {
  day:"Sunday",
  title:"Hello82 Pop-up",
  time:"8:00 AM",
  place:"Barnes & Noble",
  address:"2418 E Colonial Dr, Orlando, FL 32803",
  description:"Hello82 Offical Pop-up",
  image:"goldh61.jpg",
  lat:28.5516405,
  lng:-81.3497879,
  link:"https://hello82.com/blogs/announcements/ateez-golden-hour-part-6-album-release-event-locations?srsltid=AYCX9vJeob4YINomOrvjW84hayGK6HdzuG8dkI9zGE7WwgloR9MiTDuP"
 },

 {
  day:"Friday",
  title:"Comeback Event",
  time:"1:00 PM - 5:00 PM",
  place:"Blended Bistro and Boba",
  address:"2306 Edgewater Dr, Orlando, FL 32804",
  description:"Ateez, Xikers, and TXT Comeback Event",
  image:"./goldh61.jpg",
  lat:28.5723578,
  lng: -81.3895850,
  link:"https://www.instagram.com/p/DfDY1V8iE99/?cplk=cHlsa2prdmF0eWMw"
 },
 
 {
  day:"Saturday",
  title:"Golden Hour PT 6 Cupsleeve",
  time:"1:00 PM - 5:00 PM",
  place:"Ding Tea Orlando",
  address:"4680 Millenia Plaza Way, Orlando, FL 32839",
  description:"Album Cupsleeve Celebration",
  image:"goldh61.jpg",
  lat:28.4944374,
  lng:-81.4292460,
  link:"https://www.instagram.com/p/DemRcmdNL0p/?rpxt=cm9qdXJmMGVwY2o5"
 },

 {
  day:"Saturday",
  title:"Ateez Trading Event",
  time:"12:00 PM - 3:00 PM",
  place:"Dreamy Tea",
  address:"12623 W Colonial Dr B, Winter Garden, FL 34787",
  description:"Ateez Photocard Trading Event",
  image:"goldh61.jpg",
  lat:28.5524,
  lng:-81.5459,
  link:"https://www.instagram.com/p/DfiebDgoG2Q/?xtok=NThnZmtmbTJzZDlx"
 },

];

/* MAP */
const map=L.map("map").setView([28.5383,-81.3792],11);

L.tileLayer(
 "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
 {attribution:"© OpenStreetMap contributors"}
).addTo(map);

const pins=L.featureGroup().addTo(map);
let currentDay="Friday";

function safe(text){
 return String(text??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 })[c]);
}
 
function safeURL(value) {
  if (!value) return "";

  try {
    const url = new URL(value, window.location.href);

    return ["https:", "http:"].includes(url.protocol)
      ? url.href
      : "";
  } catch {
    return "";
  }
}

function showDay(day,button){
 currentDay=day;
 document.querySelectorAll(".tabs button")
  .forEach(b=>b.classList.remove("active"));
 button.classList.add("active");
 render();
}

function render(){
 document.getElementById("heading").textContent=
  "✦ "+currentDay+" Events";

 const list=document.getElementById("list");
 list.innerHTML="";
 pins.clearLayers();

 const filtered=events.filter(e=>e.day===currentDay);

 if(!filtered.length){
  list.innerHTML='<div class="empty">✧<h3>No events added yet</h3><p>Check back soon!</p></div>';
  map.setView([28.5383,-81.3792],11);
  return;
 }

 filtered.forEach(e=>{
  const lat=Number(e.lat),lng=Number(e.lng);
  if(!Number.isFinite(lat)||!Number.isFinite(lng))return;

  const card=document.createElement("div");
  card.className="card";

  const image=safeURL(e.image);
  const link=safeURL(e.link);

  card.innerHTML=`
   ${image?
    `<img src="${safe(image)}" alt="${safe(e.title)}">`:
    '<div class="image-placeholder">✦ EVENT PHOTO ✦</div>'
   }
   <div class="details">
    <span class="time">★ ${safe(e.time)}</span>
    <h3>${safe(e.title)}</h3>
    <p>📍 ${safe(e.place)}</p>
    <p>${safe(e.description)}</p>
   </div>`;

  list.appendChild(card);

  const pin=L.marker([lat,lng]).addTo(pins);
  pin.bindPopup(`
   <h3>★ ${safe(e.title)}</h3>
   <p>🕒 ${safe(e.time)}</p>
   <p>📍 ${safe(e.address)}</p>
   <p>${safe(e.description)}</p>
   ${link?`<a href="${safe(link)}" target="_blank" rel="noopener noreferrer">Event Details ↗</a>`:""}
  `);

  card.onclick=()=>{
   map.setView([lat,lng],14);
   pin.openPopup();
  };
 });

 if(pins.getLayers().length){
  map.fitBounds(pins.getBounds().pad(.2),{maxZoom:13});
 }
}

render();
</script>
</body>
</html>
